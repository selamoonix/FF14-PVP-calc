<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 PVP計算器</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #ff4757;
            --success-color: #2ed573;
            --warning-color: #ffa502;
            --text-color: #f1f2f6;
            --text-muted: #a4b0be;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 550px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h2 {
            text-align: center;
            margin: 0 0 5px 0;
            font-size: 26px;
            color: #fff;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .date-dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .date-box {
            text-align: center;
        }

        .date-box .label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .date-box .val {
            font-size: 16px;
            font-weight: bold;
            margin-top: 5px;
            color: #fff;
        }

        .countdown-highlight {
            color: var(--warning-color) !important;
            font-size: 20px !important;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 25px;
            display: none;
        }

        .progress-container {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            height: 10px;
            width: 100%;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #57606f, var(--success-color));
            height: 100%;
            width: 0%;
            transition: width 0.6s ease;
        }

        .comment-card {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid var(--accent-color);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .comment-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 15px;
        }

        .calc-table {
            width: 100%;
            border-collapse: collapse;
        }

        .calc-table th, .calc-table td {
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }

        .calc-table th {
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: normal;
        }

        .calc-table td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .highlight {
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🌵FF14 PVP計算器🌵</h2>
    <div class="subtitle">繁中服 7.11 ｜ 目標：第 7 系列賽 25 級畢業</div>

    <div class="date-dashboard">
        <div class="date-box">
            <div class="label">⏰ 今天的日期</div>
            <div class="val" id="today-date">2026/--/--</div>
        </div>
        <div class="date-box">
            <div class="label">🏁 預計季末 (7.2改版日)</div>
            <div class="val" id="countdown-days"><span class="countdown-highlight">--</span> 天後</div>
        </div>
    </div>
    
    <div class="input-row">
        <div>
            <label for="current-level">當前系列賽等級</label>
            <input type="number" id="current-level" min="1" max="25" placeholder="1 - 25">
        </div>
        <div>
            <label for="current-exp">目前等級經驗值</label>
            <input type="number" id="current-exp" min="0" placeholder="e.g. 1500">
        </div>
    </div>
    
    <button onclick="calculatePvP()">即刻同步戰況</button>

    <div class="result-box" id="resultBox">
        <div style="display: flex; justify-content: space-between; font-size: 14px;">
            <span id="exp-status">還差 -- 經驗值</span>
            <span id="percent-status" style="font-weight: bold; color: var(--success-color);">0%</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="comment-card">
            <div class="comment-title" id="commentTitle">📡 戰術評估中...</div>
            <div id="commentBody">請點擊上方按鈕計算。</div>
        </div>
        
        <table class="calc-table">
            <thead>
                <tr>
                    <th>推薦玩法</th>
                    <th>全勝場 (1500 exp)</th>
                    <th>常規場 (平均 1250 exp)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>⚔️ 紛爭前線 (戰場)</td>
                    <td id="fl-win" class="highlight">-</td>
                    <td id="fl-avg" class="highlight">-</td>
                </tr>
                <tr>
                    <td>💎 水晶衝突 (CC)</td>
                    <td id="cc-win" class="highlight">-</td>
                    <td id="cc-avg" class="highlight" style="color: var(--text-muted); font-weight: normal;">-</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const targetDate = new Date("2026-06-23T00:00:00");
    let daysRemaining = 0;

    function initDates() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('today-date').innerText = `${yyyy}/${mm}/${dd}`;

        const timeDiff = targetDate.getTime() - today.getTime();
        daysRemaining = Math.ceil(timeDiff / (1000 * 3600 * 24));

        if (daysRemaining < 0) {
            document.getElementById('countdown-days').innerHTML = `<span class="countdown-highlight" style="color:var(--accent-color) !important;">已截止</span>`;
            daysRemaining = 0;
        } else {
            document.getElementById('countdown-days').innerHTML = `<span class="countdown-highlight">${daysRemaining}</span> 天`;
        }
    }

    initDates();

    // 每一級升到下一級所需的經驗值
    const expTable = {
        1: 2000,  2: 2000,  3: 2000,  4: 2000,
        5: 3000,  6: 3000,  7: 3000,  8: 3000,  9: 3000,
        10: 4000, 11: 4000, 12: 4000, 13: 4000, 14: 4000,
        15: 5500, 16: 5500, 17: 5500, 18: 5500, 19: 5500,
        20: 7500, 21: 7500, 22: 7500, 23: 7500, 24: 7500,
        25: 0
    };

    function calculatePvP() {
        const currentLevel = parseInt(document.getElementById('current-level').value);
        const currentExp = parseInt(document.getElementById('current-exp').value) || 0;
        
        if (isNaN(currentLevel) || currentLevel < 1) {
            alert("請輸入正確的當前等級！");
            return;
        }

        if (currentLevel >= 25) {
            showResult(100, 0, "🎉 評價：等級到了還算什麼", "來去金碟囉！", 0, 0, 0, 0);
            return;
        }

        const expLimitForNextLevel = expTable[currentLevel];
        if (currentExp >= expLimitForNextLevel) {
            alert(`在 ${currentLevel} 級，升級所需經驗只有 ${expLimitForNextLevel} 喔！請檢查輸入是否有誤。`);
            return;
        }

        // 🎯 【全新鋼鐵邏輯】直接計算「從當前等級到 25 級還差多少經驗」
        let remainingExp = expLimitForNextLevel - currentExp; // 先算當前這一級還差多少升級
        for (let i = currentLevel + 1; i < 25; i++) {
            remainingExp += expTable[i]; // 再加上後面每一級需要的死數據
        }

        // 🎯 百分比改用「最純粹的等級進度比例」來算，絕對不會爆表
        // 加上目前等級內部的微幅經驗趴數
        const exactLevelProgress = currentLevel + (currentExp / expLimitForNextLevel);
        const progressPercent = ((exactLevelProgress / 25) * 100).toFixed(1);

        const flAvgGames = Math.ceil(remainingExp / 1250);
        
        let title = "";
        let body = "";
        let cardColor = "var(--accent-color)";

        if (daysRemaining <= 0) {
            title = "🛑 賽季已結束";
            body = "哭啊，這期系列賽已經關閉。明年再來。";
        } else {
            const flGamesPerDay = (flAvgGames / daysRemaining).toFixed(1);

            if (flGamesPerDay <= 0.3) {
                title = "☕ 評價：有料";
                body = `距離賽季結束還有 ${daysRemaining} 天。平均每 3~4 天去打 1 場戰場即可畢業。每天打日隨甚至能提早拿到獎勵，水喔`;
                cardColor = "var(--success-color)";
            } else if (flGamesPerDay <= 1.0) {
                title = "⚔️ 評價：去打日隨";
                body = `平均每天只要打 ${flGamesPerDay} 場戰場。記得打日隨！`;
                cardColor = "var(--success-color)";
            } else if (flGamesPerDay <= 3.0) {
                title = "⚠️ 評價：別拖了";
                body = `平均每天得打 ${flGamesPerDay} 場戰場。你不想像你的期末報告一樣拖到最後吧⋯⋯`;
                cardColor = "var(--warning-color)";
            } else {
                title = "🔥 評價：打 不 完 啦";
                body = `你平均每天要打 ${flGamesPerDay} 場紛爭前線。有點死透透瞭、、、`;
                cardColor = "var(--accent-color)";
            }
        }

        const commentCard = document.querySelector('.comment-card');
        commentCard.style.borderLeftColor = cardColor;
        
        showResult(
            progressPercent, 
            remainingExp, 
            title, 
            body, 
            Math.ceil(remainingExp / 1500), 
            flAvgGames, 
            Math.ceil(remainingExp / 900), 
            Math.ceil(remainingExp / 800)
        );
    }

    function showResult(percent, remain, title, body, flW, flA, ccW, ccA) {
        document.getElementById('exp-status').innerHTML = remain > 0 ? `還差 <span style="color:var(--accent-color); font-weight:bold;">${remain}</span> 經驗值畢業` : `已完成目標`;
        document.getElementById('percent-status').innerText = `${percent}%`;
        document.getElementById('progressBar').style.width = `${percent}%`;
        
        document.getElementById('commentTitle').innerText = title;
        document.getElementById('commentBody').innerText = body;

        document.getElementById('fl-win').innerText = `${flW} 場`;
        document.getElementById('fl-avg').innerText = `${flA} 場`;
        
        document.getElementById('cc-win').innerText = `${ccW} 場`;
        document.getElementById('cc-avg').innerText = `${ccA} 場 (勝率50%)`;

        document.getElementById('resultBox').style.display = "block";
    }
</script>

</body>
</html>
